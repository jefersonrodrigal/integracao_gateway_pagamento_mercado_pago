# Ambiente de desenvolvimento/homologação: PostgreSQL + migrations + API + worker.
#   cp .env.example .env   # preencha as credenciais de TESTE do Mercado Pago
#   docker compose up --build
name: payment-api

x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://payments:${POSTGRES_PASSWORD:-payments-dev}@db:5432/payments
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payments-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # exposto só localmente
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
